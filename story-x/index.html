<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сюжет Икс</title><style>:root{--bg:#070b09;--panel:#0c130f;--line:#193326;--text:#d9e7df;--muted:#7f998c;--accent:#53d68a;--accent2:#b7ffd2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#123322 0,#070b09 48%);color:var(--text);font:16px/1.75 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:900px;margin:auto;padding:28px 18px 70px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}.brand{letter-spacing:.18em;color:var(--accent);font-weight:700}.status{font-size:12px;color:var(--muted)}article{margin-top:38px;background:rgba(12,19,15,.82);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 20px 70px #0008}h1{font-size:clamp(28px,5vw,46px);line-height:1.1;margin:0 0 20px;color:var(--accent2)}h2{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 22px}.scene{white-space:pre-wrap}.choices{display:grid;gap:10px;margin-top:30px}button{appearance:none;border:1px solid #28553c;background:#0d1b13;color:var(--text);padding:13px 15px;border-radius:9px;text-align:left;font:inherit;cursor:pointer;transition:.15s}button:hover{border-color:var(--accent);background:#11271a;color:#fff}.secondary{font-size:12px;color:var(--muted);background:rgba(7,11,9,.45);border-color:#26382f;letter-spacing:.01em}.secondary:hover{border-color:#4b6557;background:#0a120e;color:var(--text)}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid #13241b}.controls button{padding:8px 11px}.action-button{position:relative;overflow:hidden;border-color:#28553c;background:#0d1b13;color:var(--text);isolation:isolate}.action-button .matrix-code{position:absolute;inset:-35%;z-index:-1;opacity:.16;color:var(--accent);font-family:monospace;font-size:12px;line-height:1.15;letter-spacing:.12em;word-break:break-all;white-space:normal;transform:rotate(-6deg);animation:matrix-drift 7s linear infinite;pointer-events:none}.action-button .action-label{position:relative;z-index:2;text-shadow:0 1px 4px #000}.action-button:hover .matrix-code{opacity:.28;animation-duration:3.5s}@keyframes matrix-drift{from{transform:translateY(-8%) rotate(-6deg)}to{transform:translateY(8%) rotate(-6deg)}}.save-status{font-size:12px;color:var(--muted);min-height:20px;align-self:center}.save-ok{color:var(--accent)}.save-error{color:#ff9b9b}footer{margin-top:16px;color:var(--muted);font-size:12px}.pulse{color:var(--accent)}@media(max-width:600px){article{padding:20px}.top{align-items:flex-start}.status{text-align:right}}body.transitioning article{box-shadow:0 0 0 1px var(--accent),0 20px 90px #000,0 0 45px rgba(83,214,138,.22)}.route-note{margin-top:18px;padding:12px 14px;border-left:2px solid var(--accent);background:rgba(83,214,138,.05);color:var(--muted);font-size:13px}</style></head><body><main><header class="top"><div class="brand">STORY_X</div><div class="status">OPEN · нелинейная версия</div></header><article><h2 id="chapter"></h2><h1 id="title"></h1><div id="scene" class="scene"></div><div id="choices" class="choices"></div><div class="controls"><button class="secondary" id="restart">Начать сначала</button><button class="secondary" id="save">Сохранить состояние</button><span id="save-status" class="save-status" aria-live="polite"></span></div></article><footer>Состояние этой версии хранится только в браузере. <span class="pulse">Residual</span> остаётся за пределами графа.</footer></main><script>const KEY="story-x-state-v1";let graph=null,state=null;const $=id=>document.getElementById(id);const saveState=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){console.error("Не удалось сохранить состояние:",e);return false}};const showSaveStatus=(message,ok=true)=>{const el=$("save-status");if(!el)return;el.textContent=message;el.className=ok?"save-ok":"save-error";clearTimeout(showSaveStatus.timer);showSaveStatus.timer=setTimeout(()=>{el.textContent="";el.className=""},2200)};const loadState=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch(e){console.error("Не удалось загрузить состояние:",e);return null}};function condition(ok){if(!ok)return true;if(ok.all)return ok.all.every(k=>state.flags[k]===true);if(ok.any)return ok.any.some(k=>state.flags[k]===true);return true}function effect(e={}){Object.entries(e).forEach(([k,v])=>{if(v==="toggle")state.flags[k]=!state.flags[k];else state.flags[k]=v})}function visibleChoices(n){return(n.choices||[]).filter(c=>condition(c.when))}let routeTimer=false;function makeButton(c){const b=document.createElement("button");b.className="action-button";const matrix=document.createElement("span");matrix.className="matrix-code";matrix.setAttribute("aria-hidden","true");matrix.textContent="01011001 10100110 00110101 11001010 01101101 10010110 00101110 11010001 01001100 10110100 00111001 01101010 11000101 10011010 01010111 00101101 11100010 01001001 10101110 01110010 11001001 00110110 10010101";const label=document.createElement("span");label.className="action-label";label.textContent=c.label;b.append(matrix,label);b.onclick=()=>runChoice(c);return b}async function runChoice(c){if(routeTimer)return;routeTimer=true;effect(c.effects);const path=c.route&&c.route.length?c.route:[c.to];state.history.push(state.node);for(let i=0;i<path.length;i++){state.node=path[i];state.visited.push(state.node);saveState();render(true);await new Promise(r=>setTimeout(r,i===path.length-1?120:850));}routeTimer=false;render();window.scrollTo({top:0,behavior:"smooth"})}function render(inTransition=false){document.body.classList.toggle("transitioning",inTransition);const n=graph.nodes[state.node]||graph.nodes[graph.start];$("chapter").textContent=n.chapter||"";$("title").textContent=n.title||"";$("scene").textContent=n.text||"";const box=$("choices");box.innerHTML="";if(inTransition){const p=document.createElement("div");p.className="save-status";p.textContent="Переход между слоями…";box.appendChild(p);return}visibleChoices(n).forEach(c=>box.appendChild(makeButton(c)));if(!visibleChoices(n).length){const b=document.createElement("button");b.textContent="Открыть начало снова";b.onclick=()=>restart();box.appendChild(b)}}function restart(){state={node:graph.start,flags:{},history:[],visited:[graph.start]};saveState();render()}$("restart").onclick=()=>{if(confirm("Сбросить текущую версию?"))restart()};$("save").onclick=()=>{const ok=saveState();showSaveStatus(ok?"Состояние сохранено в этом браузере":"Не удалось сохранить состояние",ok)};fetch("story_x_graph.json").then(r=>{if(!r.ok)throw Error("graph");return r.json()}).then(g=>{graph=g;state=loadState()||{node:g.start,flags:{},history:[],visited:[g.start]};render()}).catch(()=>{$("title").textContent="Граф не загружен";$("scene").textContent="Откройте эту страницу через GitHub Pages или локальный HTTP-сервер. Браузеры обычно блокируют fetch JSON при открытии HTML как file://."});</script></body></html>
