alcohol:{
brain:{name:"Мозг",level:"HIGH",causality:"Установлено для ряда острых функциональных эффектов; хронические структурные эффекты зависят от паттерна употребления",mechanisms:["нейротоксичность","нейроадаптация","системы вознаграждения"],known:["Алкоголь нарушает работу мозговых коммуникационных путей и может ухудшать память, речь, равновесие и суждение.","При длительном тяжёлом употреблении описаны изменения структуры и функции мозга.","При AUD часть изменений может улучшаться при длительной трезвости; пластичность мозга является важной частью восстановления."],not:["Нельзя утверждать, что любое употребление вызывает одинаковое структурное повреждение у каждого человека.","Нельзя считать все изменения необратимыми."],sources:[["NIAAA — Alcohol and the Brain","https://www.niaaa.nih.gov/publications/alcohol-and-brain-overview"],["NIAAA — Neuroscience: Addiction and Recovery","https://www.niaaa.nih.gov/health-professionals-communities/core-resource-on-alcohol/neuroscience-brain-addiction-and-recovery"]]},
liver:{name:"Печень",level:"HIGH",causality:"Установлено для алкоголь-ассоциированного заболевания печени",mechanisms:["метаболизм этанола","окислительный стресс","воспаление"],known:["Хроническое употребление может приводить к жировой болезни печени, алкогольному гепатиту и циррозу."],not:["Индивидуальный риск зависит от дозы, паттерна употребления и других факторов."],sources:[["NIAAA — Alcohol's Effects on the Body","https://www.niaaa.nih.gov/alcohols-effects-health/alcohols-effects-body"]]},
reproductive:{name:"Репродуктивная система",level:"MODERATE",causality:"Зависит от исхода и периода воздействия",mechanisms:["эндокринные эффекты","токсическое воздействие"],known:["Алкоголь связан с нарушениями репродуктивной функции; отдельная категория — пренатальное воздействие, которое может нарушать развитие плода."],not:["Нельзя переносить данные о пренатальном воздействии на взрослого человека без оговорок."],sources:[["NIAAA — Alcohol and the Developing Brain","https://www.niaaa.nih.gov/publications/alcohol-and-brain-overview"]]},
heart:{name:"Сердечно-сосудистая система",level:"HIGH",causality:"Зависит от исхода; риск многих состояний возрастает с употреблением",mechanisms:["сосудистые эффекты","аритмогенные эффекты"],known:["Алкоголь связан с повышением риска ряда сердечно-сосудистых состояний; причинность и величина эффекта зависят от паттерна употребления и исхода."],not:["Не следует превращать сложные дозо-ответные данные в универсальное правило для конкретного человека."],sources:[["WHO — Alcohol and cancer","https://www.who.int/europe/news-room/fact-sheets/item/alcohol-and-cancer"]]},
gut:{name:"Кишечник",level:"MODERATE",causality:"Для ряда механизмов — поддерживается; вклад в конкретное поведение изучается",mechanisms:["дисбиоз","воспаление","кишечный барьер"],known:["Алкоголь может изменять микробиоту и проницаемость кишечного барьера; gut–brain axis является активной областью исследований."],not:["Механистические данные не позволяют автоматически делать вывод о поведении конкретного человека."],sources:[["NIAAA — Alcohol and the Body","https://www.niaaa.nih.gov/alcohols-effects-health/alcohols-effects-body"]]},
mouth:{name:"Полость рта / рак",level:"HIGH",causality:"Причинная связь с несколькими видами рака установлена",mechanisms:["генотоксичность","ацетальдегид","окислительный стресс"],known:["IARC/WHO связывают алкоголь с раком полости рта, глотки, гортани, пищевода, печени, колоректальным раком и раком молочной железы у женщин.","Для рака нет установленного безопасного порога употребления алкоголя."],not:["Это утверждение о риске заболевания на уровне популяции, а не диагноз конкретного человека."],sources:[["WHO/IARC — Alcohol and cancer","https://www.who.int/europe/news-room/fact-sheets/item/alcohol-and-cancer"],["IARC — European Code Against Cancer","https://www.iarc.who.int/reference/european-code-against-cancer-4th-edition-alcohol-drinking-and-cancer/"]]}
},
smoking:{
brain:{name:"Мозг",level:"MODERATE",causality:"В основном ассоциации; причинность отдельных структурных и когнитивных эффектов требует осторожности",mechanisms:["никотин","токсическое воздействие дыма","сосудистые эффекты","зависимость"],known:["В UK Biobank (n=33 293) курение было связано с меньшим общим и региональным объёмом серого вещества; эффект зависел от интенсивности и статуса курения.","Мета-анализ 24 исследований обнаружил поперечные ассоциации хронического курения с вниманием, памятью, когнитивной гибкостью и некоторыми видами импульсивности.","Острое влияние никотина, абстиненция и хронические эффекты — разные вопросы и не должны смешиваться."],not:["Ассоциация не доказывает, что курение является единственной причиной когнитивного различия.","Данные о креативности не позволяют утверждать, что курение универсально «улучшает» или «ухудшает» творчество."],sources:[["UK Biobank — Smoking and brain volume","https://pubmed.ncbi.nlm.nih.gov/36528239/"],["Systematic review/meta-analysis — neuropsychological impairments","https://pubmed.ncbi.nlm.nih.gov/30502351/"]]},

heart:{name:"Сердечно-сосудистая система",level:"HIGH",causality:"Причинная связь с сердечно-сосудистым риском установлена",mechanisms:["сосудистая дисфункция","воспаление","окислительный стресс"],known:["Курение повышает риск сердечно-сосудистых заболеваний и инсульта."],not:["Индивидуальный риск зависит от стажа, интенсивности и сопутствующих факторов."],sources:[["WHO — Tobacco","https://www.who.int/news-room/fact-sheets/detail/tobacco"]]},

const factorsEl=document.getElementById("factors"),dataEl=document.getElementById("data"),body=document.getElementById("body"),brain=document.getElementById("brain");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function renderFactors(){const q=(document.getElementById("factorSearch")?.value||"").toLowerCase().trim();const shown=factors.filter(f=>f.label.toLowerCase().includes(q));document.getElementById("factorCount").textContent=shown.length+"/"+factors.length;factorsEl.innerHTML=shown.map(f=>'<button class="factor '+(state.factor===f.id?'active':'')+'" data-factor="'+f.id+'" aria-pressed="'+(state.factor===f.id)+'"><span class="dot"></span>'+esc(f.label)+(f.pending?' <span class="muted">· скоро</span>':'')+'</button>').join("");factorsEl.querySelectorAll(".factor").forEach(b=>b.onclick=()=>{state.factor=b.dataset.factor;state.organ=null;render()})}
function renderView(){body.hidden=state.view!=="body";brain.hidden=state.view!=="brain";document.getElementById("modeTitle").textContent=state.view==="brain"?"BRAIN":"BODY";document.body.classList.toggle("mode-evidence",state.mode==="evidence")}
function renderRegions(){document.querySelectorAll(".region").forEach(r=>{const id=r.dataset.id;const d=(common[state.factor]||{})[id];r.classList.toggle("impact",!!d);r.classList.toggle("active",state.organ===id)})}
function renderPanel(){const d=(common[state.factor]||{})[state.organ];const f=factors.find(x=>x.id===state.factor);if(!d){dataEl.innerHTML='<div class="empty"><div><div style="font-size:28px;margin-bottom:10px">◌</div><b>'+esc(f?.label||"Фактор")+'</b><p>Данные ещё проходят методологическую верификацию. В атласе лучше показать отсутствие проверенного знания, чем заполнить пробел предположением.</p></div></div>';return}
dataEl.innerHTML='<div class="label">'+esc(f.label)+' → '+esc(d.name)+'</div><h1>'+esc(d.name)+'</h1><div class="sub">Карта доказательств, а не диагноз. Уровень уверенности относится к конкретному утверждению, а не ко всему фактору.</div><div class="chips">'+d.mechanisms.map(x=>'<span class="chip">'+esc(x)+'</span>').join("")+'</div><div class="block"><div class="label">УРОВЕНЬ ДОКАЗАТЕЛЬНОСТИ</div><span class="badge">'+esc(d.level)+'</span></div><div class="block"><div class="label">ПРИЧИННОСТЬ / СВЯЗЬ</div><div>'+esc(d.causality)+'</div></div><div class="block"><div class="label">ЧТО ИЗВЕСТНО</div>'+d.known.map(x=>'<p class="fact">'+esc(x)+'</p>').join("")+'</div><div class="block"><div class="label">ЧЕГО ЭТО НЕ ДОКАЗЫВАЕТ</div><div class="caveat">'+d.not.map(x=>'<div>'+esc(x)+'</div>').join("")+'</div></div><div class="block"><div class="label">ИСТОЧНИКИ</div>'+d.sources.map(s=>'<a class="source" href="'+s[1]+'" target="_blank" rel="noopener">'+esc(s[0])+'<small>Открыть первичный/официальный источник ↗</small></a>').join("")+'</div><div class="block"><div class="label">КАК ЧИТАТЬ</div><p class="muted">HIGH — несколько независимых линий данных или хорошо установленная причинная связь для указанного исхода. MODERATE — данные поддерживают связь, но остаются существенные ограничения, неоднородность или неопределённость причинности.</p><p class="muted">Механистические, клеточные и животные данные не равны доказательству клинического эффекта у человека. Корреляция не равна причинности.</p></div><div class="block muted">Статус записи: рабочая редакция · дата ревизии: 20.09.2026.</div>'}
function render(){renderFactors();renderView();renderRegions();renderPanel()}
document.querySelectorAll(".organ").forEach(r=>{r.addEventListener("click",()=>{state.organ=state.organ===r.dataset.id?null:r.dataset.id;render()});r.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();state.organ=r.dataset.id;render()}})});
document.getElementById("toggleView").onclick=()=>{state.view=state.view==="body"?"brain":"body";state.organ=state.view==="brain"?"pfc":"brain";render()};
document.getElementById("clear").onclick=()=>{state.factor="alcohol";state.organ=null;state.mode="visual";render()};document.getElementById("evidence").onclick=()=>{state.mode=state.mode==="evidence"?"visual":"evidence";document.getElementById("evidence").textContent=state.mode==="evidence"?"EVIDENCE: ON":"EVIDENCE";render()};document.getElementById("factorSearch").addEventListener("input",renderFactors);
document.getElementById("quiet").onclick=e=>{state.quiet=!state.quiet;document.body.classList.toggle("quiet",state.quiet);e.currentTarget.textContent=state.quiet?"QUIET: ON":"QUIET ROOM"};
document.querySelectorAll("[data-mode]").forEach(()=>{});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){state.organ=null;render()}});
document.getElementById("stage").addEventListener("dblclick",()=>{state.view=state.view==="body"?"brain":"body";render()});
render();
</script>
</body></html>
