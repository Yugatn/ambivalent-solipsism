<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Конструктор опросников</title><style>body{margin:0;background:#02050a;color:#eef7f5;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:30px}.card{background:#071015;border:1px solid #16473e;border-radius:18px;padding:20px;margin:14px 0}input,textarea,select{width:100%;box-sizing:border-box;margin:7px 0 14px;padding:12px;border-radius:10px;background:#03090c;color:#eef7f5;border:1px solid #16473e}button{padding:11px 16px;border-radius:10px;background:#071a18;color:#45f0c3;border:1px solid #287b6b;cursor:pointer;margin-right:8px}.q{border-top:1px solid #16473e;padding:18px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><main><a href="../" style="color:#9aacab">Амбивалентный Солипсизм</a><h1>Конструктор опросников</h1><p>Создавайте собственные исследовательские анкеты. Определение сохраняется локально и экспортируется в JSON.</p><div class="card"><label>Название</label><input id="title" value="Новый опросник"><label>Описание</label><textarea id="desc"></textarea><label>Статус</label><select id="status"><option>authorial-research</option><option>self-observation</option><option>research</option><option>draft</option></select></div><div id="questions"></div><button onclick="addQ()">Добавить вопрос</button><button onclick="save()">Сохранить</button><button onclick="downloadJSON()">Экспорт JSON</button><button onclick="load()">Загрузить</button><div class="card"><h2>Предпросмотр</h2><div id="preview"></div></div><script>let qs=[];function addQ(){qs.push({id:"q"+Date.now(),type:"single",text:"Новый вопрос",required:true,options:["Вариант 1","Вариант 2"],dimension:""});render()}function render(){document.getElementById("questions").innerHTML=qs.map((q,i)=>'<div class="card q"><div class="row"><div><label>Тип</label><select onchange="qs['+i+'].type=this.value;render()"><option value="single" '+(q.type==="single"?"selected":"")+'>Один вариант</option><option value="multiple" '+(q.type==="multiple"?"selected":"")+'>Несколько вариантов</option><option value="scale" '+(q.type==="scale"?"selected":"")+'>Шкала</option><option value="text" '+(q.type==="text"?"selected":"")+'>Текст</option><option value="number" '+(q.type==="number"?"selected":"")+'>Число</option><option value="yesno" '+(q.type==="yesno"?"selected":"")+'>Да/Нет</option></select></div><div><label>Измерение</label><input value="'+esc(q.dimension||"")+'" oninput="qs['+i+'].dimension=this.value"></div></div><label>Вопрос</label><textarea oninput="qs['+i+'].text=this.value">'+esc(q.text)+'</textarea><label><input type="checkbox" '+(q.required?"checked":"")+' onchange="qs['+i+'].required=this.checked"> Обязательный</label><div><label>Варианты через ;</label><input value="'+esc((q.options||[]).join(";"))+'" oninput="qs['+i+'].options=this.value.split(";")"></div><button onclick="qs.splice('+i+',1);render()">Удалить</button></div>').join("");preview()}function preview(){document.getElementById("preview").innerHTML=qs.map((q,i)=>'<div class="q"><b>'+esc(q.text)+'</b><p>'+((q.options||[]).map(o=>'<label><input type="'+(q.type==="multiple"?"checkbox":"radio")+'" name="p'+i+'"> '+esc(o)+'</label><br>').join(""))+'</p></div>').join("")}function esc(s){return String(s??"").replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]))}function data(){return {schema_version:"0.1",id:"questionnaire-"+Date.now(),title:document.getElementById("title").value,description:document.getElementById("desc").value,research_status:document.getElementById("status").value,version:"0.1",questions:qs}}function save(){localStorage.setItem("as-questionnaire",JSON.stringify(data()));alert("Сохранено локально.")}function load(){let x=localStorage.getItem("as-questionnaire");if(!x)return alert("Сохранённый опросник не найден.");let d=JSON.parse(x);title.value=d.title;desc.value=d.description;status.value=d.research_status;qs=d.questions||[];render()}function downloadJSON(){let b=new Blob([JSON.stringify(data(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(data().title||"questionnaire")+".json";a.click();URL.revokeObjectURL(a.href)}addQ();</script></main></body></html>
