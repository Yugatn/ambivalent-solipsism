<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Карта восприятия — Амбивалентный Солипсизм</title><style>:root{--bg:#050505;--fg:#f5f5f5;--muted:#999;--line:#292929;--card:#0d0d0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}header{max-width:1100px;margin:auto;padding:42px 22px 22px;border-bottom:1px solid var(--line)}h1{font-size:clamp(30px,6vw,58px);line-height:1.02;margin:0 0 10px}h2{font-size:25px;margin:42px 0 12px}.wrap{max-width:1100px;margin:auto;padding:20px 22px 120px}.notice,.result{border:1px solid var(--line);background:var(--card);padding:17px;border-radius:12px;margin-bottom:22px}.meta{color:var(--muted);font-size:13px}.progress{height:6px;background:#222;border-radius:9px;overflow:hidden;margin-top:17px}.progress i{display:block;height:100%;width:0;background:#fff;transition:.2s}.q{border-top:1px solid var(--line);padding:22px 0}.q label{display:block;font-weight:650;margin-bottom:12px}.choices{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.choices button,.actions button{background:#101010;color:#eee;border:1px solid #444;border-radius:7px;padding:8px 12px;cursor:pointer}.choices button.active,.actions button.primary{background:#fff;color:#000}.q textarea{width:100%;min-height:82px;resize:vertical;background:#090909;color:#fff;border:1px solid #333;border-radius:8px;padding:11px;font:inherit}.basis{margin-top:8px;color:#aaa;font-size:13px}.basis select{background:#090909;color:#eee;border:1px solid #333;border-radius:6px;padding:5px}.actions{position:fixed;bottom:0;left:0;right:0;background:rgba(5,5,5,.96);border-top:1px solid var(--line);padding:11px max(22px,calc((100vw - 1100px)/2));display:flex;gap:8px;z-index:10}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.stat{border:1px solid #292929;border-radius:8px;padding:12px}.stat b{display:block;font-size:22px}.tag{display:inline-block;border:1px solid #444;border-radius:99px;padding:2px 8px;margin:3px;font-size:12px}@media(max-width:600px){.wrap{padding-left:15px;padding-right:15px}.actions{padding:10px 15px;flex-wrap:wrap}.actions button{flex:1}.q textarea{min-height:100px}}</style></head><body><header><h1>Карта восприятия</h1><p>Интерактивный опросник Амбивалентного Солипсизма</p><div class="meta">Версия 0.40 · 110 вопросов · самоисследование, не диагностика</div><div class="progress"><i id="bar"></i></div></header><main class="wrap"><div class="notice"><b>Принцип.</b> Опросник не решает за вас, кем вы являетесь. Он фиксирует позицию, основания, неизвестности и противоречия. <b>UNKNOWN</b> — полноценный ответ.</div><div id="form"></div><section id="result" class="result hidden"></section></main><div class="actions"><button class="primary" id="finish">Построить карту</button><button id="save">Сохранить JSON</button><button id="load">Загрузить JSON</button><button id="reset">Сбросить</button><input id="file" type="file" accept=".json" hidden></div><script>
const blocks=[["Субъект и восприятие",["Осознаёте ли вы себя субъектом восприятия реальности? Что именно вы называете «собой»?","Что является субъектом: тело, мозг, память, личность, сознание, душа, симбиоз или нечто другое?","Можете ли вы отделить «я» от описания себя?","Если существует максимально подробный цифровой профиль человека, будет ли этот профиль самим человеком? Почему?","Может ли State измениться, а Identity сохраниться?","Сводим ли субъект к наблюдаемым характеристикам?","Если система знает о вас больше фактов, чем вы помните о себе, становится ли она вами лучше, чем вы сами?"]],["Восприятие и реальность",["Что есть реальность?","Имеете ли вы прямой доступ к внешнему миру или воспринимаете его через органы чувств и когнитивные процессы?","Может ли восприятие быть неполным, не означая, что реальность является иллюзией?","Если два субъекта воспринимают одно событие по-разному, обязан ли один ошибаться?","Может ли модель реальности быть полезной и одновременно неполной?","Согласны ли вы с Reality = Model + Residual? Что означает Residual?","Что важнее при недостатке информации: завершённый ответ или сохранение неизвестности?"]],["UNKNOWN и границы знания",["Имеет ли система право сказать «я не знаю»?","Может ли UNKNOWN быть корректным результатом?","Что опаснее: признать неизвестность или заполнить её правдоподобной выдумкой?","Если алгоритм не может надёжно определить намерение, должен ли он выбирать удобную интерпретацию?","Должна ли высокая неопределённость уменьшать право на необратимое действие?","Как отличить Residual от ошибки, скрытой под UNKNOWN?"]],["Модель и субъект",["Согласны ли вы: Модель субъекта ≠ субъект?","Является ли психологический профиль человеком?","Является ли reputation score человеком?","Является ли prediction о будущем поведении фактом о человеке?","Может ли алгоритмическая классификация быть полезной, не становясь определением личности?","Должна ли оценка автоматически создавать право ограничивать человека?","Может ли одна информация быть допустимой в одном контексте и недопустимой в другом?"]],["Другой",["Что означает «Другой — реален»?","Можете ли вы непосредственно знать внутренний опыт другого?","Если нет, на каком основании вы признаёте существование другого субъекта?","Является ли «Другой — реален» доказательством или принципом действия при неопределённости?","Что опаснее: ошибочно признать субъектом того, кто им не является, или отрицать субъектность реально существующего?","Согласны ли вы с Shared Incompleteness / Общей неполнотой?","Должна ли власть классифицирующей системы иметь ограничения из-за неполноты модели?"]],["Душа и тело как транспорт",["Что есть Душа?","Считаете ли вы себя душой, находящейся в симбиозе с центральной нервной системой и телом?","Если да, является ли это философской гипотезой, личным опытом, верой или установленным фактом?","Может ли тело быть частью жизненной реальности и транспортом, через который субъект воспринимает и действует?","Что означает «тело как транспорт»?","Обесценивает ли эта метафора тело и здоровье?","Если транспорт повреждён, ограничивается ли пространство возможностей субъекта?","Являются ли здоровье, медицина, образование, безопасность и ресурсы условиями развития?","Согласны ли вы: Симбиоз ≠ владение?"]],["Память, Identity и время",["Что такое память?","Является ли память самим субъектом?","Если человек потерял часть памяти, перестал ли он быть тем же субъектом?","Что такое Identity?","Что такое State?","Может ли State изменяться, не уничтожая Identity?","Что есть время?","Является ли время свойством реальности, восприятия или отношением между изменениями?","Если память меняется, меняется ли субъект или его модель прошлого?","Можно ли восстановить прошлое полностью?"]],["Смерть",["Что для вас означает смерть?","Является ли смерть окончательным прекращением субъекта или границей знания о дальнейшем состоянии?","Что вы думаете о страхе смерти?","Может ли человек не знать, что происходит после смерти, не превращая неизвестность в отрицание или утверждение?","Допустимо ли: «Мы не знаем, что находится за границей смерти»?","Может ли UNKNOWN быть честнее уверенного отрицания или подтверждения посмертного существования?"]],["Перерождение и трансперсональное бессмертие",["Что вы думаете о перерождении?","Что могло бы перерождаться: душа, субъект, память, импульс, след или другое?","Различаете ли вы продолжение личности, памяти, импульса, следа и метафизическое перерождение?","Является ли трансперсональное бессмертие утверждением о доказанной жизни после смерти?","Может ли фраза умершего человека продолжать менять ваше решение?","Если да, является ли это продолжением его импульса через вас?","Где граница между трансперсональным бессмертием и обычным культурным влиянием?","Согласны ли вы с триадой Душа, Импульс, След?"]],["Импульс и След",["Что такое Импульс?","Что такое След?","Может ли след существовать после прекращения жизни тела?","Может ли след быть искажён и всё ещё оставаться следом первоначального импульса?","Можно ли считать факт изменения маршрута другого субъекта проверяемым проявлением следа?"]],["Социальная суперпозиция",["Что такое социальная суперпозиция?","Можете ли вы одновременно быть для себя центром опыта, для другого близким, для работодателя работником, для государства гражданином, а для алгоритма набором данных?","Равна ли какая-либо социальная роль субъекту?","Может ли один субъект иметь противоречивые социальные роли?","Согласны ли вы: Социальная функция ≠ субъект?","Что происходит, когда одна социальная роль полностью определяет отношение системы к человеку?"]],["Закон развития и этика",["Как вы понимаете Закон развития: «Можно лишь то, что не вредит здоровью и развитию других субъектов»?","Что такое вред?","Всегда ли несогласие является вредом?","Всегда ли конфликт является разрушением?","Может ли конкуренция быть совместима с Законом развития?","Где граница между конкуренцией и разрушением развития другого?","Должно ли ограничение быть обоснованным, пропорциональным, проверяемым и по возможности обратимым?","Кто должен иметь право пересматривать ограничение?","Должно ли краткосрочное преимущество одного автоматически считаться развитием?"]],["Власть, данные и AI",["Может ли система знать много фактов о человеке и всё равно иметь неполную модель субъекта?","Создаёт ли классификация право управлять классифицированным?","Согласны ли вы с Authority Separation?","Согласны ли вы: Capability ≠ Permission?","Должен ли AI отказаться от окончательного решения при недостатке данных?","Должно ли действие AI становиться более ограниченным при росте неопределённости?","Должен ли человек знать, почему система приняла значимое решение о нём?","Должна ли существовать возможность пересмотра значимого решения?","Что опаснее: ошибка классификации или превращение классификации в необратимое решение?"]],["Когнитивная безопасность",["Что такое когнитивная безопасность?","Является ли способность воспринимать, сравнивать, выбирать и пересматривать убеждения частью субъектности?","Может ли информационная среда ограничивать эту способность?","Что такое семантическая экология?","Должен ли субъект иметь возможность выйти из информационного воздействия?","Может ли защита от манипуляции сама превратиться в чрезмерный контроль?","Как отличить защиту когнитивной безопасности от управления мышлением?"]],["Критика и самоисправление",["Что произойдёт с вашей моделью мира, если появятся противоречащие ей данные?","Готовы ли вы изменить убеждение, которое считали частью идентичности?","Может ли критика быть полезной даже тогда, когда она ошибочна?","Согласны ли вы: Сложность — не ошибка?","Допустимо ли оставить фундаментальный вопрос открытым?","Если критика разрушает элемент модели, должны ли вы защищать его любой ценой?","Что важнее: непротиворечивость собственной системы или соответствие обнаруженным основаниям?","Какая часть Амбивалентного Солипсизма наиболее уязвима для критики?"]],["Практическое применение",["Если AI должен оценить риск, должен ли он отделять оценку риска от права на вмешательство?","Какие действия AI допустимы при неполной модели субъекта?","Какие действия требуют участия человека?","Какие действия должны быть обратимыми?","Что должен делать AI при недостаточной уверенности?","Должно ли действие системы учитываться при оценке последующего результата?","Может ли вмешательство системы изменить человека настолько, что исходная модель перестанет быть применима?","Должна ли система иметь возможность признать: «моя предыдущая модель была неполной»?"]],["Предельные вопросы",["Если всё доступное вам знание проходит через восприятие, на каком основании вы говорите о реальности вне восприятия?","Если другой субъект непосредственно недоступен, почему вы не становитесь классическим солипсистом?","Если реальность другого нельзя окончательно доказать, почему вы выбираете принцип «Другой — реален»?","Если модель субъекта не равна субъекту, как практически принимать решения о другом?","Если UNKNOWN допустим, когда система всё-таки обязана действовать?","Каким должен быть предел действия при UNKNOWN?","Если тело — транспорт, кто принимает решения: душа, мозг, их симбиоз или нечто, что нельзя разделить?","Если память не субъект, что связывает субъекта сегодня и десять лет назад?","Если импульс продолжает существовать через других, где заканчивается субъект и начинается след?","Если социальная роль не равна субъекту, может ли общество полностью описать человека?","Что произойдёт с АС, если одна из её фундаментальных гипотез окажется ложной?"]]];
const scale=[0,1,2,3,4],basis=["не указано","опыт","аргумент","данные","вера","интуиция","предположение","UNKNOWN"];let answers=JSON.parse(localStorage.getItem("as-questionnaire-v2")||"{}");const root=document.querySelector("#form");
function persist(){localStorage.setItem("as-questionnaire-v2",JSON.stringify(answers));update()}
function update(){const qs=document.querySelectorAll(".q"),done=[...qs].filter(q=>answers[q.dataset.id]?.v!==undefined||answers[q.dataset.id]?.text?.trim()).length;document.querySelector("#bar").style.width=(done/qs.length*100)+"%"}
function render(){root.innerHTML="";let n=0;for(const [title,qs] of blocks){const sec=document.createElement("section");sec.innerHTML="<h2>"+title+"</h2>";for(const text of qs){n++;const id="q"+n,a=answers[id]||{},q=document.createElement("div");q.className="q";q.dataset.id=id;q.innerHTML="<label>"+n+". "+text+"</label><div class='choices'>"+scale.map(v=>"<button type='button' data-v='"+v+"'>"+v+"</button>").join("")+"</div><textarea placeholder='Ваш ответ, аргумент или UNKNOWN'></textarea><div class='basis'>Основание: <select>"+basis.map(x=>"<option>"+x+"</option>").join("")+"</select></div>";sec.appendChild(q);if(a.v!==undefined)q.querySelectorAll("button")[a.v].classList.add("active");q.querySelector("textarea").value=a.text||"";q.querySelector("select").value=a.basis||"не указано";q.querySelectorAll("button").forEach(b=>b.onclick=()=>{q.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active");answers[id]={...answers[id],v:+b.dataset.v};persist()});q.querySelector("textarea").oninput=e=>{answers[id]={...answers[id],text:e.target.value};persist()};q.querySelector("select").onchange=e=>{answers[id]={...answers[id],basis:e.target.value};persist()}}root.appendChild(sec)}update()}
function map(){const all=Object.values(answers),a=all.filter(x=>x.v!==undefined),c={accepted:a.filter(x=>x.v===4).length,qualified:a.filter(x=>x.v===3).length,unknown:a.filter(x=>x.v===2).length,rejected:a.filter(x=>x.v<=1).length};const r=document.querySelector("#result");r.classList.remove("hidden");r.innerHTML="<h2>Карта позиции</h2><p>Это не рейтинг и не процент «Амбивалентного Солипсизма». Это описание заполненности ответов.</p><div class='grid'><div class='stat'><b>"+a.length+"</b>отвечено</div><div class='stat'><b>"+c.accepted+"</b>принято</div><div class='stat'><b>"+c.qualified+"</b>с оговорками</div><div class='stat'><b>"+c.unknown+"</b>UNKNOWN</div><div class='stat'><b>"+(all.length-a.length)+"</b>не исследовано</div></div><p>Ответы и основания остаются локально в браузере. Экспорт JSON можно использовать для собственного последующего анализа.</p>";r.scrollIntoView({behavior:"smooth"})}
document.querySelector("#finish").onclick=map;document.querySelector("#save").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({version:"0.40",type:"Ambivalent Solipsism questionnaire",responses:answers},null,2)],{type:"application/json"}));a.download="ambivalent-solipsism-questionnaire.json";a.click()};document.querySelector("#load").onclick=()=>document.querySelector("#file").click();document.querySelector("#file").onchange=e=>{const rd=new FileReader();rd.onload=()=>{try{answers=JSON.parse(rd.result).responses||{};persist();render()}catch{alert("Не удалось прочитать JSON")}};rd.readAsText(e.target.files[0])};document.querySelector("#reset").onclick=()=>{if(confirm("Сбросить все ответы?")){answers={};persist();render();scrollTo(0,0)}};render();
</script></body></html>
