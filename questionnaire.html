<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Опросник — Амбивалентный Солипсизм</title>
<style>
:root{--bg:#050505;--fg:#f4f4f4;--muted:#9a9a9a;--line:#262626;--card:#0d0d0d;--accent:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}header{padding:48px 22px 28px;border-bottom:1px solid var(--line);max-width:1100px;margin:auto}h1{font-size:clamp(28px,5vw,52px);line-height:1.05;margin:0 0 12px}h2{margin-top:42px;line-height:1.2}p{color:#ddd}.wrap{max-width:1100px;margin:auto;padding:22px}.notice{border:1px solid var(--line);background:var(--card);padding:18px;border-radius:12px}.q{border-top:1px solid var(--line);padding:20px 0}.q label{display:block;font-weight:600;margin-bottom:10px}.q textarea{width:100%;min-height:92px;background:#090909;color:var(--fg);border:1px solid #333;border-radius:8px;padding:12px;font:inherit}.scale{display:flex;gap:8px;flex-wrap:wrap}.scale button,.actions button{background:#111;color:#eee;border:1px solid #444;border-radius:7px;padding:8px 12px;cursor:pointer}.scale button.active,.actions button:hover{background:#eee;color:#000}.actions{position:sticky;bottom:0;background:rgba(5,5,5,.94);border-top:1px solid var(--line);padding:14px 0;display:flex;gap:10px;flex-wrap:wrap}.bar{height:5px;background:#222;border-radius:5px;overflow:hidden;margin:16px 0}.bar i{display:block;height:100%;width:0;background:#fff}small{color:var(--muted)}a{color:#fff}
</style></head><body><header><h1>Опросник</h1><p>Амбивалентный Солипсизм / Ambivalent Solipsism</p><small>Версия 0.40 · философское самоисследование, не диагностика</small><div class="bar"><i id="progress"></i></div></header><main class="wrap"><div class="notice"><b>Важно.</b> Опросник не определяет, «кто вы». Он строит карту ваших ответов, неизвестностей и противоречий. UNKNOWN — допустимый ответ.</div><form id="form"></form><div class="actions"><button type="button" id="save">Сохранить JSON</button><button type="button" id="reset">Сбросить</button><a href="QUESTIONNAIRE.md" target="_blank">Открыть полный текст</a></div></main>
<script>
const blocks=[
["Субъект и восприятие",["Осознаёте ли вы себя субъектом восприятия реальности? Что именно вы называете «собой»?","Имеете ли вы прямой доступ к реальности вне собственного восприятия?","Может ли восприятие быть неполным, не означая, что реальность является иллюзией?","Согласны ли вы: Модель субъекта ≠ субъект?"]],
["Реальность и UNKNOWN",["Что есть реальность?","Согласны ли вы: Reality = Model + Residual? Что для вас Residual?","Имеет ли система право сказать UNKNOWN — я не знаю?","Должна ли высокая неопределённость уменьшать право системы на необратимое действие?"]],
["Другой",["Что означает «Другой — реален»?","Можете ли вы непосредственно знать внутренний опыт другого?","Согласны ли вы с Shared Incompleteness / Общей неполнотой?","Должна ли власть классифицирующей системы иметь ограничения из-за неполноты её модели?"]],
["Душа и тело как транспорт",["Что есть Душа?","Считаете ли вы себя душой, находящейся в симбиозе с центральной нервной системой и телом?","Что означает «тело как транспорт»?","Если транспорт повреждён, ограничивается ли пространство возможностей субъекта?"]],
["Память, Identity и время",["Что такое память?","Является ли память самим субъектом?","Что такое Identity?","Что такое State?","Что есть время?"]],
["Смерть и перерождение",["Что для вас означает смерть?","Что вы думаете о перерождении?","Допустимо ли сказать: «Мы не знаем, что находится за границей смерти»?","Где проходит граница между трансперсональным бессмертием и обычным культурным влиянием?"]],
["Социальная суперпозиция",["Что такое социальная суперпозиция?","Равна ли какая-либо социальная роль субъекту?","Согласны ли вы: Социальная функция ≠ субъект?"]],
["Закон развития",["Как вы понимаете Закон развития?","Всегда ли несогласие является вредом?","Может ли конкуренция быть совместима с Законом развития?","Должно ли ограничение быть обоснованным, пропорциональным, проверяемым и по возможности обратимым?"]],
["Критика",["Что произойдёт с вашей моделью мира, если появятся данные, противоречащие ей?","Допустимо ли оставить фундаментальный вопрос UNKNOWN?","Какая часть Амбивалентного Солипсизма кажется вам наиболее уязвимой для критики?"]]
];
const f=document.querySelector("#form");let n=0;
for(const [title,qs] of blocks){const s=document.createElement("section");s.innerHTML="<h2>"+title+"</h2>";for(const q of qs){n++;const d=document.createElement("div");d.className="q";d.dataset.n=n;d.innerHTML="<label>"+n+". "+q+"</label><div class='scale'>"+[0,1,2,3,4].map(v=>"<button type='button' data-v='"+v+"'>"+v+"</button>").join("")+"</div><textarea placeholder='Ваш ответ / основание / UNKNOWN'></textarea>";s.appendChild(d)}f.appendChild(s)}
document.querySelectorAll(".q").forEach(q=>q.querySelectorAll("button").forEach(b=>b.onclick=()=>{q.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active");q.dataset.value=b.dataset.v;update()}));
function update(){const done=[...document.querySelectorAll(".q")].filter(q=>q.dataset.value||q.querySelector("textarea").value.trim()).length;document.querySelector("#progress").style.width=done/n*100+"%"}
document.querySelector("#save").onclick=()=>{const out={version:"0.40",type:"philosophical-self-inquiry",responses:[...document.querySelectorAll(".q")].map(q=>({id:+q.dataset.n,scale:q.dataset.value??"UNKNOWN",answer:q.querySelector("textarea").value}))};const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:"application/json"}));a.download="ambivalent-solipsism-questionnaire.json";a.click();URL.revokeObjectURL(a.href)};
document.querySelector("#reset").onclick=()=>{if(confirm("Сбросить все ответы?")){localStorage.removeItem("as-questionnaire");location.reload()}}; 
</script></body></html>
