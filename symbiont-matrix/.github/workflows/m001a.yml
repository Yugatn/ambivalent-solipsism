name: Symbiont Matrix M-001a

on:
  push:
    paths:
      - "symbiont-matrix/**"
  pull_request:
    paths:
      - "symbiont-matrix/**"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symbiont-matrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
