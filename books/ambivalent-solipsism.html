<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Амбивалентный Солипсизм — Полная книга</title>
<style>
:root{--bg:#07100f;--paper:#f5f0e5;--text:#302d27;--accent:#45f0c3;--muted:#9db1ae}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e9f1ee;font-family:Georgia,"Times New Roman",serif}
header{max-width:920px;margin:auto;padding:70px 22px 35px}h1{font-size:clamp(38px,7vw,68px);font-weight:500;line-height:1.05;margin:18px 0}header p{color:#bfcfc9;font-size:18px;line-height:1.7}.meta{font:11px monospace;color:var(--accent);letter-spacing:.12em}
.toolbar{position:sticky;top:10px;z-index:5;max-width:920px;margin:0 auto 22px;padding:10px 12px;background:rgba(5,12,11,.94);border:1px solid rgba(69,240,195,.18);border-radius:12px;display:flex;gap:8px;align-items:center}.toolbar button{background:#10211e;color:#e9f1ee;border:1px solid rgba(69,240,195,.2);border-radius:8px;padding:9px 12px}.toolbar span{flex:1;font:11px monospace;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toc{display:none;max-width:920px;margin:0 auto 20px;padding:15px;background:#0b1715;border:1px solid rgba(69,240,195,.15);border-radius:12px}#toc.open{display:block}#toc button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(69,240,195,.08);padding:9px;color:#cfe0dc}
main{max-width:920px;margin:auto;padding:0 22px 100px}.chapter{background:var(--paper);color:var(--text);padding:clamp(34px,7vw,80px) clamp(24px,8vw,82px);margin:0 auto 32px;box-shadow:0 20px 60px #0008}.chapter h1,.chapter h2,.chapter h3,.chapter h4{color:#211f1b;line-height:1.2}.chapter h1{font-size:42px}.chapter h2{font-size:34px}.chapter h3{font-size:24px;margin-top:38px}.chapter p,.chapter li{font-size:17px;line-height:1.82}.chapter blockquote{border-left:3px solid #587f73;padding:14px 20px;background:#587f7312}.chapter pre{white-space:pre-wrap;overflow:auto}.chapter a{color:#28695a}
.status{max-width:920px;margin:0 auto 18px;padding:12px 22px;color:#9db1ae;font:12px monospace}
</style>
</head>
<body>
<header><div class="meta">BOOK · COMPLETE EDITION</div><h1>Амбивалентный<br>Солипсизм</h1><p>Полная читательская версия корпуса книги. Существующие главы BOOK сохраняются как исходные материалы; этот файл собирает их в единую последовательность для просмотра.</p><p>Сложность — не ошибка. Другой — реален.</p></header>
<div class="toolbar"><button id="prev">‹</button><span id="label">Загрузка книги…</span><button id="tocBtn">Оглавление</button><button id="next">›</button></div>
<div id="toc"></div><div id="status" class="status">Подготовка текста…</div><main id="book"></main>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const files=["00A_CONCEPT_AUDIT.md","00_AS_BACKUP_CORE.md","00_STORY_X.md","01_PERCEPTION_AND_SUBJECT.md","02_REALITY_MODEL_AND_RESIDUAL.md","03_SOCIAL_SUPERPOSITION.md","04A_EXISTENCE_SUBJECT_AND_OTHER.md","04_THE_OTHER_AS_SUBJECT.md","05_INDIVIDUALITY_AND_RIGHT_TO_EXIT.md","06_LAW_OF_DEVELOPMENT.md","07_ETHICS_AND_HARM.md","08_SOCIETY_AS_INTERCONNECTED_SYSTEM.md","09_POWER_INFORMATION_AND_PERCEPTION.md","10_AI_AND_SYMBIONT.md","11_CONSTITUTION.md","12_ETHICS_OF_STATE_SERVICE.md","13_CIVIL_SERVICE_SELECTION.md","14_DIAGNOSTIC_MATRIX_STATE_SERVICE.md","15_SEMANTIC_ECOLOGY.md","16_SEMANTIC_IMPACT_MATRIX.md","17_CINEMA_COMPLEMENTARITY.md","18_SYSTEMIC_INTERDEPENDENCE_AND_SELF_CORRECTION.md","19_PICCS_LIMITED_RESPONSIBILITY.md","20_ECONOMY_SOLIDARITY_AND_DEVELOPMENT.md","21_QUIET_ROOM_AND_COGNITIVE_SOVEREIGNTY.md","22_COMMUNICATION_AND_COGNITIVE_SAFETY.md","23_ETHICALAUDIT_FORMALIZATION.md","24_COMMUNICATION_ECOSYSTEM.md","25_DYNAMIC_DEVELOPMENT_ECONOMY.md","25_RIGHT_TO_ERROR_AND_REVISION.md","26_TIME_MEMORY_AND_CHANGING_SUBJECT.md","27_BODY_HEALTH_AND_SUBJECT.md","28_DEATH_FINALITY_AND_UNKNOWN.md","29_RESIDUAL_AND_EPISTEMOLOGY_OF_UNKNOWN.md","30_IMPERFECTNESS_IMPERATIVE.md","31A_GOST_MINIMUM_PRISON_NUTRITION.md","31_PRISON_REFORM.md","32_BRAIN_AS_FRACTAL_AND_HUMAN_HISTORY.md","33_FEAR_OF_DEATH_AND_GENERATIONAL_CONTINUITY.md","34_SOCIAL_LABOR_NETWORK.md","35_PSY_TOOLS_AND_SUBJECT_MODEL.md","36_CONSCIOUSNESS_SEMI_TRANCE_AND_AUTOMATIC_LAYERS.md","37_GAME_PLAY_PERCEPTION_AND_DEVELOPMENT.md","38_EXTERNAL_AND_INTERNAL_PERCEPTION.md","39_FAMILY_SOLIDARITY_AND_SOCIAL_STRUCTURE.md","40_ST_NETWORK_TRUST_AND_DEVELOPMENT.md","41_EVOLUTIONARY_DEPTH_AND_AI_WORLD.md"];
const base="../BOOK/";
const book=document.getElementById("book"),status=document.getElementById("status"),label=document.getElementById("label"),toc=document.getElementById("toc");
let chapters=[],current=0;
function titleFrom(md,name){const m=md.match(/^#\s+(.+)$/m)||md.match(/^##\s+(.+)$/m);return m?m[1].trim():name.replace(/\.md$/,"").replace(/_/g," ");}
async function load(){
 const results=[];
 for(let i=0;i<files.length;i++){
   status.textContent="Загрузка "+(i+1)+" из "+files.length+"…";
   try{const r=await fetch(base+encodeURIComponent(files[i]));if(!r.ok)throw new Error(r.status);const md=await r.text();results.push({name:files[i],md,title:titleFrom(md,files[i])});}
   catch(e){results.push({name:files[i],md:"_Материал не удалось загрузить автоматически._",title:files[i]});}
 }
 chapters=results;
 chapters.forEach((c,i)=>{const sec=document.createElement("article");sec.className="chapter";sec.innerHTML=marked.parse(c.md);sec.dataset.i=i;book.appendChild(sec);
   const b=document.createElement("button");b.textContent=(i+1)+". "+c.title;b.onclick=()=>show(i);toc.appendChild(b);});
 status.textContent="Загружено материалов: "+chapters.length;
 show(0);
}
function show(i){if(!chapters.length)return;current=Math.max(0,Math.min(i,chapters.length-1));document.querySelectorAll(".chapter").forEach((x,j)=>x.style.display=j===current?"block":"none");label.textContent=(current+1)+" / "+chapters.length+" · "+chapters[current].title;document.getElementById("prev").disabled=current===0;document.getElementById("next").disabled=current===chapters.length-1;window.scrollTo({top:0,behavior:"smooth"});}
document.getElementById("prev").onclick=()=>show(current-1);document.getElementById("next").onclick=()=>show(current+1);document.getElementById("tocBtn").onclick=()=>toc.classList.toggle("open");
load();
</script>
</body></html>
