version: 2
allowed_statuses:
  - planned
  - specified
  - model_checked
  - conformant
  - audited

claims:
  - id: AntiReplay
    depends_on: [EpochTransition]
    falsification_criteria: "A reachable execution accepts the same authenticated message or sequence identifier twice within the same epoch and causes two state transitions."
    falsification_test: "eugene-messenger/tests/test_replay_attack.py"
    threat_category: [Tampering, Spoofing]
    statement: "A previously accepted authenticated message MUST NOT cause a second state transition."
    status: specified
    artifacts:
      specification: "eugene-messenger/tla-models.html"
      formal_model: "eugene-messenger/spec/AntiReplay.tla"
      config: "eugene-messenger/spec/AntiReplay.cfg"
      implementation: null
      conformance: null
      adversarial_test: "eugene-messenger/tests/test_replay_attack.py"
      benchmark: null
      evidence: "eugene-messenger/evidence/anti-replay/"
    assumptions:
      - "Message authentication succeeds before acceptance."
    residual_risk: "The model does not prove cryptographic primitive security or endpoint integrity."

  - id: RelayNeverReceivesPlaintext
    depends_on: []
    falsification_criteria: "A reachable relay-side execution receives E2EE plaintext bytes within the defined trust boundary."
    falsification_test: null
    threat_category: [InformationDisclosure]
    statement: "A federation relay MUST NOT receive E2EE plaintext."
    status: specified
    artifacts:
      specification: "eugene-messenger/trust-model.html"
      formal_model: null
      implementation: null
      conformance: null
      adversarial_test: null
      benchmark: null
      evidence: null
    assumptions:
      - "Endpoint cryptographic state is uncompromised."
    residual_risk: "Traffic metadata, endpoint compromise, and global traffic correlation remain outside this claim."

  - id: RevokedCapabilityCannotExecute
    depends_on: [IdentityContinuity]
    falsification_criteria: "A revoked capability authorizes an operation after the authoritative revocation event."
    falsification_test: null
    threat_category: [ElevationOfPrivilege, Tampering]
    statement: "A revoked capability MUST NOT authorize a subsequent operation."
    status: specified
    artifacts:
      specification: "eugene-messenger/capability-security.html"
      formal_model: "eugene-messenger/spec/CapabilityLifecycle.tla"
      implementation: null
      conformance: null
      adversarial_test: null
      benchmark: null
      evidence: null
    assumptions:
      - "Revocation state is authoritative within the defined trust boundary."
    residual_risk: "A compromised host or runtime may bypass application-level controls."

  - id: IdentityContinuity
    depends_on: []
    falsification_criteria: "A reachable execution resurrects a revoked identity or accepts a transition that violates the defined continuity relation."
    falsification_test: "eugene-messenger/identity-continuity/IdentityContinuity_Broken.cfg"
    threat_category: [Spoofing, ElevationOfPrivilege]
    statement: "A valid identity transition MUST preserve continuity constraints defined by the identity specification."
    status: planned
    artifacts:
      specification: "eugene-messenger/identity-continuity.html"
      formal_model: null
      implementation: null
      conformance: null
      adversarial_test: null
      benchmark: null
      evidence: null
    assumptions:
      - "The root identity key remains protected within PICCS-Core."
    residual_risk: "Recovery and compromise semantics are not yet formally modeled."

  - id: EpochTransition
    depends_on: []
    falsification_criteria: "A message from an invalid prior epoch is accepted and mutates session state."
    falsification_test: null
    threat_category: [Tampering, Replay]
    statement: "An epoch transition MUST prevent acceptance of messages from an invalid prior epoch."
    status: planned
    artifacts:
      specification: "eugene-messenger/tla-models.html"
      formal_model: null
      implementation: null
      conformance: null
      adversarial_test: null
      benchmark: null
      evidence: null
    assumptions:
      - "Epoch authority is unambiguous within the session state machine."
    residual_risk: "Forward-secrecy properties are not established by this state claim."

dependency_rules:
  require_acyclic: true
  model_checked_requires_dependencies_at_least: specified

traceability_rules:
  formally_verified_requires:
    - formal_model
    - config
    - evidence
  conformant_requires:
    - implementation
    - conformance
    - adversarial_test
  audited_requires:
    - evidence
