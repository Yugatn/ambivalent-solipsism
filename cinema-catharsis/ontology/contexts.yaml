ontology_version: 0.1.0
context_axes:
  consequence: [none_shown, positive, negative, ambiguous, delayed]
  representation: [neutral, emphasized, minimized, stylized, explicit, implicit, unknown]
  actor_role: [agent, target, observer, facilitator, victim, perpetrator, unknown]
  camera_emphasis: [none, low, medium, high, unknown]
  social_reaction: [none, approval, disapproval, mixed, neutral, unknown]
  verbal_context: [none, descriptive, approving, disapproving, ambiguous, unknown]
  music: [none, neutral, reinforcing, contrasting, unknown]
  recurrence: [isolated, repeated, motif, unknown]
  narrative_role: [incidental, functional, central, climactic, unknown]
rule: "Context axes are independent observations; no single axis is equivalent to romanticization."
