<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1250"><rect width="1200" height="1250" fill="#071118"/><g font-family="Arial"><text x="55" y="70" fill="#eef7f5" font-size="38" font-weight="700">CONTENT PASSPORT 3.0</text><text x="55" y="105" fill="#91a7a7" font-size="17">Illustrative schema — values are examples, not verified film measurements</text><rect x="55" y="145" width="1090" height="170" rx="18" fill="#10242a" stroke="#45f0c3"/><text x="85" y="190" fill="#45f0c3" font-size="15">IDENTITY</text><text x="85" y="235" fill="#eef7f5" font-size="30">Example Work</text><text x="85" y="270" fill="#91a7a7" font-size="17">content_id · content_hash · runtime · language · provenance</text><rect x="55" y="350" width="1090" height="330" rx="18" fill="#10242a" stroke="#45f0c3"/><text x="85" y="395" fill="#45f0c3" font-size="15">CONTENT MAP</text><g fill="#eef7f5" font-size="19"><text x="90" y="440">Class</text><text x="400" y="440">N</text><text x="540" y="440">T</text><text x="690" y="440">screen_time_share</text><text x="950" y="440">status</text></g><g fill="#91a7a7" font-size="18"><text x="90" y="485">example_program</text><text x="400" y="485">—</text><text x="540" y="485">—</text><text x="690" y="485">—</text><text x="950" y="485">unknown</text><text x="90" y="530">another_program</text><text x="400" y="530">—</text><text x="540" y="530">—</text><text x="690" y="530">—</text><text x="950" y="530">present</text><text x="90" y="575">third_program</text><text x="400" y="575">—</text><text x="540" y="575">—</text><text x="690" y="575">—</text><text x="950" y="575">ambiguous</text><text x="90" y="620">fourth_program</text><text x="400" y="620">—</text><text x="540" y="620">—</text><text x="690" y="620">—</text><text x="950" y="620">absent*</text></g><rect x="55" y="715" width="520" height="300" rx="18" fill="#10242a" stroke="#45f0c3"/><rect x="625" y="715" width="520" height="300" rx="18" fill="#10242a" stroke="#45f0c3"/><g fill="#45f0c3" font-size="15"><text x="85" y="760">UNCERTAINTY / COVERAGE</text><text x="655" y="760">VALIDATION</text></g><g fill="#91a7a7" font-size="17"><text x="85" y="805">temporal coverage: reported</text><text x="85" y="845">modal coverage: reported</text><text x="85" y="885">measurement uncertainty: reported</text><text x="85" y="925">completeness: preliminary / complete</text><text x="655" y="805">inter-coder reliability: α / κ</text><text x="655" y="845">reference-set precision / recall</text><text x="655" y="885">calibration</text><text x="655" y="925">drift / manual review</text></g><text x="55" y="1075" fill="#ffcc66" font-family="Arial" font-size="18">* absent is valid only when coverage ≥ C_min.</text><text x="600" y="1140" fill="#eef7f5" font-family="Arial" font-size="19" text-anchor="middle">A passport reports evidence and uncertainty. It does not produce a harm rating.</text><text x="600" y="1175" fill="#91a7a7" font-family="Arial" font-size="17" text-anchor="middle">Illustrative example · ontology/model/measurement/validation versions must be fixed per analysis.</text></g></svg>