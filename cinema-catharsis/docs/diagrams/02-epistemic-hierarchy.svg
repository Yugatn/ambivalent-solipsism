<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#071118"/><g font-family="Arial"><text x="60" y="75" fill="#eef7f5" font-size="40" font-weight="700">ЭПИСТЕМИЧЕСКАЯ ИЕРАРХИЯ</text><text x="60" y="112" fill="#91a7a7" font-size="18">No automatic leap from observation to interpretation or causality</text></g><g font-family="Arial" text-anchor="middle"><g stroke="#45f0c3" stroke-width="2" fill="#10242a"><rect x="120" y="155" width="960" height="115" rx="18"/><rect x="120" y="300" width="960" height="115" rx="18"/><rect x="120" y="445" width="960" height="115" rx="18"/><rect x="120" y="590" width="960" height="115" rx="18"/><rect x="120" y="735" width="960" height="115" rx="18"/><rect x="120" y="880" width="960" height="115" rx="18"/></g><g fill="#45f0c3" font-size="17" font-weight="700"><text x="175" y="190">L0</text><text x="175" y="335">L1</text><text x="175" y="480">L2</text><text x="175" y="625">L3</text><text x="175" y="770">L4</text><text x="175" y="915">L5</text></g><g fill="#eef7f5" font-size="27" font-weight="700"><text x="600" y="205">OBSERVATION</text><text x="600" y="350">EVENT</text><text x="600" y="495">ONTOLOGY / MANIFESTATION</text><text x="600" y="640">OBSERVED CONTEXT</text><text x="600" y="785">INTERPRETATION</text><text x="600" y="930">AUDIENCE RESPONSE / EFFECT / CAUSAL INFERENCE</text></g><g fill="#91a7a7" font-size="16"><text x="600" y="240">object · action · sound · word · face</text><text x="600" y="385">linked primitives</text><text x="600" y="530">formal class assignment</text><text x="600" y="675">shot · location · role · music · recurrence</text><text x="600" y="820">multiple hypotheses · basis · confidence · provenance</text><text x="600" y="965">requires audience data and an appropriate research design</text></g></g><g fill="#ff7676" font-family="Arial" font-size="19" text-anchor="middle"><text x="600" y="1045">L3 → L4: interpretation must be explicitly marked.</text><text x="600" y="1080">L4 → L5: no automatic causal inference.</text></g><text x="600" y="1145" fill="#91a7a7" font-family="Arial" font-size="17" text-anchor="middle">The project directly publishes L0–L3; L4 is possible only as marked interpretation; L5 requires separate evidence.</text></svg>