<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500"><rect width="1200" height="1500" fill="#071118"/><g fill="#eef7f5" font-family="Arial"><text x="60" y="80" font-size="42" font-weight="700">СИНЕМА КАТАРСИС</text><text x="60" y="120" font-size="20" fill="#91a7a7">Reference architecture · observability, not evaluation</text></g><g font-family="Arial" text-anchor="middle"><g fill="#10242a" stroke="#45f0c3" stroke-width="2"><rect x="160" y="170" width="880" height="110" rx="18"/><rect x="160" y="320" width="880" height="110" rx="18"/><rect x="160" y="470" width="880" height="110" rx="18"/><rect x="160" y="620" width="880" height="110" rx="18"/><rect x="160" y="770" width="880" height="110" rx="18"/><rect x="160" y="920" width="880" height="110" rx="18"/><rect x="160" y="1070" width="880" height="110" rx="18"/><rect x="160" y="1220" width="880" height="110" rx="18"/></g><g fill="#45f0c3" font-size="16" font-weight="700"><text x="205" y="205">01</text><text x="205" y="355">02</text><text x="205" y="505">03</text><text x="205" y="655">04</text><text x="205" y="805">05</text><text x="205" y="955">06</text><text x="205" y="1105">07</text><text x="205" y="1255">08</text></g><g fill="#eef7f5" font-size="28" font-weight="700"><text x="600" y="215">SOURCES</text><text x="600" y="365">INGESTION</text><text x="600" y="515">SEGMENTATION</text><text x="600" y="665">MULTIMODAL EXTRACTION</text><text x="600" y="815">FUSION · L0 → L1 → L2 → L3</text><text x="600" y="965">MEASUREMENT</text><text x="600" y="1115">VALIDATION</text><text x="600" y="1265">CONTENT PASSPORT / PUBLICATION</text></g><g fill="#91a7a7" font-size="17"><text x="600" y="250">media + metadata · subject to lawful access/licensing</text><text x="600" y="400">hash · normalization · deduplication · queue</text><text x="600" y="550">shots → scenes → sequences</text><text x="600" y="700">vision · audio · speech · text · manual annotation</text><text x="600" y="850">Primitive → Event → Manifestation → observed_context</text><text x="600" y="1000">N · T · screen_time_share · C · ρ · R · uncertainty</text><text x="600" y="1150">reliability · validity · coverage · calibration · drift</text><text x="600" y="1300">map · passport · API · human-readable results</text></g></g><g stroke="#45f0c3" stroke-width="3" fill="none"><path d="M600 280v40M600 430v40M600 580v40M600 730v40M600 880v40M600 1030v40M600 1180v40"/></g><g font-family="Arial" fill="#91a7a7" font-size="18" text-anchor="middle"><text x="600" y="1400">The system measures and publishes. It does not infer audience harm from content presence alone.</text><text x="600" y="1435">screen_time_share ≠ viewer_exposure · reliability ≠ validity · absence requires sufficient coverage</text></g></svg>