<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050"><rect width="1200" height="1050" fill="#071118"/><g font-family="Arial"><text x="60" y="70" fill="#eef7f5" font-size="38" font-weight="700">CONTENT WHEEL</text><text x="60" y="105" fill="#91a7a7" font-size="17">Illustrative ontology profile · color encodes class, not value</text><circle cx="600" cy="560" r="300" fill="none" stroke="#1b3a40" stroke-width="90"/><circle cx="600" cy="560" r="180" fill="#071118" stroke="#45f0c3" stroke-width="2"/><g fill="#eef7f5" font-size="15" text-anchor="middle"><text x="600" y="300">C1</text><text x="775" y="355">C2</text><text x="885" y="500">C3</text><text x="885" y="660">C4</text><text x="775" y="790">C5</text><text x="600" y="840">C6</text><text x="425" y="790">C7</text><text x="315" y="660">C8</text><text x="315" y="500">C9</text><text x="425" y="355">C10</text></g><g fill="#45f0c3" font-size="23" text-anchor="middle"><text x="600" y="515">screen_time_share</text><text x="600" y="550">or selected metric</text></g><g fill="#91a7a7" font-size="16" text-anchor="middle"><text x="600" y="585">overlap policy must be explicit</text><text x="600" y="610">zero ≠ unknown</text></g><g fill="#eef7f5" font-size="16"><text x="980" y="330">C1 consumption</text><text x="980" y="365">C2 action</text><text x="980" y="400">C3 interaction</text><text x="980" y="435">C4 corporeality</text><text x="980" y="470">C5 environment</text><text x="980" y="505">C6 attributes</text><text x="980" y="540">C7 narrative</text><text x="980" y="575">C8 communication</text><text x="980" y="610">C9 economics</text><text x="980" y="645">C10 social/civic</text></g><text x="600" y="945" fill="#91a7a7" font-family="Arial" font-size="17" text-anchor="middle">Krippendorff’s α describes coding reliability; it is not a wheel “quality” score.</text></svg>