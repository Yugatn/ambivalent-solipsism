name: Eugene Messenger domain

on:
  push:
    paths:
      - "eugene-messenger/**"
  pull_request:
    paths:
      - "eugene-messenger/**"

jobs:
  rust-domain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eugene-messenger
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo check --workspace

  tla-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download TLA+ tools
        run: curl -fsSL -o /tmp/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
      - name: Run Anti-Replay positive and negative controls
        working-directory: eugene-messenger
        env:
          TLA2TOOLS_JAR: /tmp/tla2tools.jar
        run: bash assurance/run_tlc.sh
      - name: Upload assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anti-replay-evidence
          path: eugene-messenger/evidence/anti-replay/