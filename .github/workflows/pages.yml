name: Deploy STSet Network to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare public artifact without the retired Story X pages
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/approved-pages"
          mkdir -p "$dest"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/story-x/' \
            --exclude='/BOOK/00_STORY_X.*' \
            --exclude='/BOOK/STORY_X_*' \
            ./ "$dest/"
          test ! -e "$dest/story-x/index.html"
          test ! -e "$dest/story-x/artifacts.html"
          test ! -e "$dest/BOOK/00_STORY_X.html"
          test ! -e "$dest/BOOK/00_STORY_X.md"
          if find "$dest/BOOK" -maxdepth 1 -name 'STORY_X_*' | grep -q .; then
            echo "Story X draft leaked into public artifact" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/approved-pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
