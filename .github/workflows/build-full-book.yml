name: Build full book
on:
  push:
    paths-ignore:
      - 'BOOK/AMBIVALENT_SOLIPSISM_FULL.md'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble full Markdown book
        shell: bash
        run: |
          set -euo pipefail
          out="BOOK/AMBIVALENT_SOLIPSISM_FULL.md"
          tmp="${out}.tmp"
          {
            printf '%s\n\n' '# Амбивалентный Солипсизм — полная книга'
            printf '%s\n\n' 'Сводная каноническая редакция корпуса BOOK. Исходные материалы не удаляются и остаются отдельными файлами.'
            printf '%s\n\n' 'Сложность — не ошибка. Другой — реален.'
            printf '%s\n\n' '## Содержание корпуса'
            find BOOK -maxdepth 1 -type f -name '*.md' ! -name 'AMBIVALENT_SOLIPSISM_FULL.md' -printf '%f\n' | sort | while read -r f; do printf '%s\n' "- $f"; done
            printf '\n---\n\n'
            find BOOK -maxdepth 1 -type f -name '*.md' ! -name 'AMBIVALENT_SOLIPSISM_FULL.md' -printf '%f\n' | sort | while read -r f; do
              printf '\n# Материал: %s\n\n' "$f"
              cat "BOOK/$f"
              printf '\n\n---\n\n'
            done
            cat <<'KINODOPO'
# Принцип кинодополняемости

## Статус принципа

Принцип кинодополняемости является частью философской и исследовательской архитектуры Амбивалентного Солипсизма. Он рассматривает художественное произведение как дополнительный контекст для исследования философской проблемы, а не как доказательство самой теории.

## Смысл

Кино может моделировать субъектность, память, идентичность, восприятие, власть, искусственный интеллект, вложенные миры и другие проблемы таким способом, который невозможно полностью передать абстрактным теоретическим текстом. Художественное произведение добавляет к философской модели особый способ переживания и представления проблемы.

При этом произведение остаётся произведением искусства. Сходство сюжета с философской гипотезой не превращает художественный сюжет в научное доказательство.

## Граница интерпретации

При анализе фильма необходимо разделять то, что утверждает произведение, философскую интерпретацию, научно установленный факт, гипотезу и аналогию.

Поэтому принцип кинодополняемости не подтверждает существование симуляции, искусственной субъектности или иных метафизических положений. Он расширяет пространство исследования, сохраняя границы между художественным образом, философской моделью и эмпирическим знанием.

## Связь с Амбивалентным Солипсизмом

Кино становится дополнительной картой человеческих вопросов. Оно позволяет исследовать, как человек представляет другого субъекта, ограниченность собственной модели реальности, изменение памяти, границы идентичности и возможные отношения между человеком и искусственным интеллектом.

Таким образом, кинодополняемость расширяет книгу, но не закрывает Residual. Художественный образ может открыть новый вопрос, но не обязан давать окончательный ответ.
KINODOPO
          } > "$tmp"
          mv "$tmp" "$out"
      - name: Commit generated book
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BOOK/AMBIVALENT_SOLIPSISM_FULL.md
          git diff --cached --quiet && exit 0
          git commit -m 'Build complete Markdown edition of the book'
          git push